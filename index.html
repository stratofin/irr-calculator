<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRR Sheet</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --surface3: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --text-dim: #484f58;
      --primary: #2f81f7;
      --primary-dark: #1f6feb;
      --primary-glow: rgba(47,129,247,0.15);
      --green: #3fb950;
      --green-glow: rgba(63,185,80,0.15);
      --orange: #d29922;
      --red: #f85149;
      --accent: #58a6ff;
      --gold: #e3b341;
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 24px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a2332 100%);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 22px; }
    .header-text h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #58a6ff, #79c0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-text p { color: var(--text-muted); font-size: 11px; margin-top: 1px; }
    .header-badge {
      margin-left: auto;
      background: var(--primary-glow);
      border: 1px solid var(--primary);
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ── Main layout ── */
    .main { max-width: 960px; margin: 0 auto; padding: 14px 20px; }

    /* ── Lang button ── */
    .lang-btn {
      margin-left: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      letter-spacing: 0.8px;
    }
    .lang-btn:hover { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* ── Rate badge ── */
    .rate-badge {
      font-size: 10px;
      color: var(--green);
      background: var(--green-glow);
      border: 1px solid rgba(63,185,80,0.3);
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .rate-badge:hover { opacity: 0.7; }
    .rate-badge.loading { color: var(--text-muted); background: var(--surface3); border-color: var(--border); }
    .rate-badge.error   { color: var(--red); background: rgba(248,81,73,0.1); border-color: rgba(248,81,73,0.3); }

    /* ── Top controls ── */
    .controls-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: stretch;
      gap: 0;
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .controls-divider {
      width: 1px;
      background: var(--border);
      flex-shrink: 0;
      align-self: stretch;
    }
    .control-block {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
    }
    .control-block label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .control-block > select,
    .control-block > .mode-toggle {
      flex: 1;
    }

    select, input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }
    select { cursor: pointer; padding-right: 8px; min-width: 160px; }
    .controls-row select { min-width: 0; padding: 5px 8px; font-size: 12px; width: 100%; }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 2px;
      width: 100%;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 0;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      flex: 1;
      text-align: center;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    .mode-btn:not(.active):hover { background: var(--surface3); color: var(--text); }

    /* ── Three data sections ── */
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .data-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .data-card.has-data { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .data-card.calculated { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
    .data-card.error-state { border-color: var(--red); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-label {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface3);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .data-card.has-data .card-label { background: var(--primary); border-color: var(--primary); color: #fff; }
    .data-card.calculated .card-label { background: var(--green); border-color: var(--green); color: #fff; }

    .card-title { font-size: 13px; font-weight: 600; }
    .card-status {
      margin-left: auto;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-filled { background: var(--primary-glow); color: var(--accent); border: 1px solid rgba(47,129,247,0.3); }
    .status-empty { background: var(--surface3); color: var(--text-dim); border: 1px solid var(--border); }
    .status-result { background: var(--green-glow); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }

    /* Field groups */
    .field-group { margin-bottom: 8px; }
    .field-group:last-child { margin-bottom: 0; }
    .field-group label {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }
    .input-prefix, .input-suffix {
      padding: 6px 8px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      background: var(--surface3);
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }
    .input-suffix { border-right: none; border-left: 1px solid var(--border); }
    .input-wrap input {
      border: none;
      background: transparent;
      padding: 6px 8px;
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      outline: none;
    }
    .input-wrap input::placeholder { color: var(--text-dim); }
    .input-wrap input.result-value { color: var(--green); font-weight: 700; }

    /* Two-column field row */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .field-row .field-group { margin-bottom: 0; }
    .field-row select { width: 100%; }

    /* Clear field btn */
    .clear-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px 6px;
      font-size: 11px;
      transition: color 0.15s;
      line-height: 1;
    }
    .clear-btn:hover { color: var(--red); }

    /* Summary inside card */
    .card-summary {
      background: var(--surface3);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      display: none;
    }
    .card-summary.visible { display: block; }
    .card-summary .sum-row { display: flex; justify-content: space-between; }
    .card-summary .sum-value { color: var(--text); font-weight: 600; }

    /* ── Calculate button area ── */
    .action-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .calc-hint {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hint-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }
    .hint-dot.ready { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 1.5s infinite; }
    .hint-dot.partial { background: var(--orange); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .btn-row { display: flex; gap: 12px; align-items: center; }

    .calc-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 700;
      padding: 11px 44px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 3px 14px rgba(47,129,247,0.3);
    }
    .calc-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 22px rgba(47,129,247,0.45); }
    .calc-btn:active { transform: translateY(0); }
    .calc-btn:disabled { background: var(--surface3); color: var(--text-dim); box-shadow: none; cursor: not-allowed; transform: none; }
    .calc-btn .btn-icon { font-size: 16px; }

    .reset-btn {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .reset-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--text-muted); }

    /* ── Result area ── */
    .result-area {
      background: var(--surface);
      border: 1px solid rgba(255,105,160,0.35);
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
      box-shadow: 0 0 0 3px rgba(255,105,160,0.08);
    }
    .result-area.visible { display: block; }

    .result-header {
      background: linear-gradient(135deg, #3a0020 0%, #2a0018 100%);
      border-bottom: 1px solid rgba(255,105,160,0.3);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .result-header-icon { font-size: 22px; }
    .result-header-text h3 { font-size: 16px; font-weight: 700; color: #ff6fa8; }
    .result-header-text p { font-size: 12px; color: rgba(255,105,160,0.6); margin-top: 2px; }

    .result-body { padding: 24px; }
    .result-main {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 8px;
    }
    .result-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .result-big {
      font-size: 42px;
      font-weight: 800;
      color: #ff6fa8;
      letter-spacing: -1px;
      line-height: 1;
    }
    .result-unit { font-size: 20px; color: #ff6fa8; font-weight: 600; }
    .result-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

    .result-breakdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .breakdown-item {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 14px;
      border: 1px solid var(--border);
    }
    .breakdown-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; }
    .breakdown-value { font-size: 18px; font-weight: 700; color: var(--text); }
    .breakdown-value.highlight { color: #ff6fa8; }
    .breakdown-value.primary { color: var(--accent); }

    /* Error message */
    .error-msg {
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.3);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--red);
      font-size: 13px;
      display: none;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
    }
    .error-msg.visible { display: flex; }

    /* Hidden utility */
    .hidden { display: none !important; }

    /* ── Period unit toggle (年/月) ── */
    .period-unit-toggle {
      display: flex;
      border-left: 1px solid var(--border);
      flex-shrink: 0;
    }
    .period-unit-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 9px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      line-height: 1;
    }
    .period-unit-btn + .period-unit-btn { border-left: 1px solid var(--border); }
    .period-unit-btn.active { background: var(--primary); color: #fff; }
    .period-unit-btn:hover:not(.active) { background: var(--surface3); color: var(--text); }

    /* ── View toggle button ── */
    .view-toggle-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    .view-toggle-btn:hover { background: var(--surface3); color: var(--text); }
    .view-toggle-btn.mobile-mode { background: var(--primary-glow); border-color: var(--primary); color: var(--accent); }

    /* ── IRR layout: left=年化input, right=月化+翻倍 stacked ── */
    .irr-layout {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: stretch;
    }
    .irr-stats-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 100px;
    }
    .irr-stat-box {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .irr-stat-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .irr-stat-val {
      font-size: 15px;
      font-weight: 700;
    }
    .irr-stat-val.monthly { color: var(--accent); }
    .irr-stat-val.rule72  { color: var(--gold); }

    /* ══ MOBILE VIEW (force-mobile) ══ */

    /* ── Layout ── */
    body.force-mobile .main         { max-width: 100% !important; padding: 10px 12px !important; }
    body.force-mobile .data-grid    { grid-template-columns: 1fr !important; gap: 10px !important; }

    /* ── Header ── */
    body.force-mobile .header       { padding: 8px 14px !important; }
    body.force-mobile .header-icon  { font-size: 20px !important; }
    body.force-mobile .header-text h1 { font-size: 16px !important; }
    body.force-mobile #subtitle-text  { display: none !important; }
    body.force-mobile .view-toggle-btn { font-size: 10px !important; padding: 3px 8px !important; }
    body.force-mobile .lang-btn       { font-size: 10px !important; padding: 3px 9px !important; }

    /* ── Controls: 貨幣 + 投資方式 垂直排列 ── */
    body.force-mobile .controls-wrapper { flex-direction: column !important; gap: 6px !important; margin-bottom: 10px !important; }
    body.force-mobile .controls-row {
      grid-template-columns: 1fr !important;
      border-radius: var(--radius) !important;
    }
    body.force-mobile .controls-divider { width: 100% !important; height: 1px !important; }
    body.force-mobile .control-block   { padding: 9px 12px !important; }
    body.force-mobile .control-block label { font-size: 10px !important; min-width: 50px !important; }
    body.force-mobile .controls-row select { font-size: 13px !important; }
    body.force-mobile .mode-btn        { font-size: 12px !important; padding: 7px 0 !important; }
    body.force-mobile .conv-toggle-btn {
      width: 100% !important;
      padding: 9px 0 !important;
      text-align: center !important;
      font-size: 12px !important;
      border-radius: var(--radius) !important;
    }

    /* ── Cards ── */
    body.force-mobile .data-card        { padding: 12px 13px !important; }
    body.force-mobile .card-title       { font-size: 13px !important; }
    body.force-mobile .card-status      { font-size: 10px !important; }
    body.force-mobile .field-group label { font-size: 10px !important; }
    body.force-mobile .input-wrap input  { font-size: 14px !important; padding: 8px 8px !important; }
    body.force-mobile .input-prefix,
    body.force-mobile .input-suffix      { font-size: 12px !important; padding: 8px 8px !important; }
    body.force-mobile .clear-btn         { padding: 8px 8px !important; font-size: 12px !important; }

    /* ── Card A: 左右欄維持，但字體與間距優化 ── */
    body.force-mobile .field-row        { gap: 6px !important; }

    /* ── Card B: IRR layout 垂直堆疊，月化+翻倍橫排 ── */
    body.force-mobile .irr-layout       { grid-template-columns: 1fr !important; gap: 6px !important; }
    body.force-mobile .irr-stats-col    { flex-direction: row !important; gap: 6px !important; min-width: 0 !important; }
    body.force-mobile .irr-stat-box     { padding: 7px 6px !important; flex: 1 !important; }
    body.force-mobile .irr-stat-label   { font-size: 9px !important; }
    body.force-mobile .irr-stat-val     { font-size: 14px !important; }

    /* ── Calculate button: 全寬，方便點按 ── */
    body.force-mobile .action-area      { margin-bottom: 12px !important; }
    body.force-mobile .btn-row          { width: 100% !important; flex-direction: column !important; gap: 8px !important; }
    body.force-mobile .calc-btn {
      width: 100% !important;
      padding: 13px 0 !important;
      font-size: 15px !important;
      justify-content: center !important;
      border-radius: var(--radius) !important;
    }
    body.force-mobile .reset-btn        { width: 100% !important; text-align: center !important; padding: 10px 0 !important; }
    body.force-mobile .calc-hint        { font-size: 11px !important; padding: 5px 12px !important; }

    /* ── Result area ── */
    body.force-mobile .result-header    { padding: 12px 16px !important; }
    body.force-mobile .result-header-icon { font-size: 18px !important; }
    body.force-mobile .result-header-text h3 { font-size: 14px !important; }
    body.force-mobile .result-header-text p  { font-size: 11px !important; }
    body.force-mobile .result-body      { padding: 14px 14px !important; }
    body.force-mobile .result-big       { font-size: 36px !important; }
    body.force-mobile .result-unit      { font-size: 16px !important; }
    body.force-mobile .result-desc      { font-size: 12px !important; margin-bottom: 12px !important; }
    body.force-mobile .result-breakdown {
      grid-template-columns: 1fr 1fr !important;
      gap: 8px !important;
    }
    body.force-mobile .breakdown-item   { padding: 10px 10px !important; }
    body.force-mobile .breakdown-label  { font-size: 10px !important; margin-bottom: 4px !important; }
    body.force-mobile .breakdown-value  { font-size: 15px !important; }

    /* ── Converter panel ── */
    body.force-mobile .converter-panel  { padding: 10px 12px !important; margin-bottom: 10px !important; }
    body.force-mobile .conv-amount-row  { flex-direction: column !important; gap: 6px !important; }
    body.force-mobile .conv-amount-wrap { max-width: 100% !important; width: 100% !important; }
    body.force-mobile .conv-eq          { text-align: center !important; }
    body.force-mobile .conv-result-box  { width: 100% !important; justify-content: center !important; padding: 10px 14px !important; }
    body.force-mobile .conv-result-num  { font-size: 22px !important; }

    /* ── Summary inside card ── */
    body.force-mobile .card-summary     { font-size: 11px !important; padding: 7px 10px !important; }
    @media (max-width: 800px) {
      .irr-layout { grid-template-columns: 1fr !important; }
      .irr-stats-col { flex-direction: row; }
    }

    /* ── Responsive ── */
    @media (max-width: 800px) {
      .data-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .result-breakdown { grid-template-columns: 1fr 1fr; }
      .main { padding: 12px 12px; }
      .calc-btn { padding: 10px 32px; font-size: 14px; }
    }
    @media (max-width: 600px) {
      .controls-row { grid-template-columns: 1fr; }
      .controls-divider { width: 100%; height: 1px; }
      .conv-toggle-btn { padding: 0 10px; font-size: 11px; }
    }
    @media (max-width: 460px) {
      .result-breakdown { grid-template-columns: 1fr; }
      .result-big { font-size: 30px; }
      .header { padding: 8px 14px; }
      .header-text h1 { font-size: 16px; }
    }
    @media (max-width: 460px) {
      .result-breakdown { grid-template-columns: 1fr; }
      .result-big { font-size: 34px; }
    }

    /* ── Controls wrapper (row + toggle btn) ── */
    .controls-wrapper {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 12px;
    }
    .controls-wrapper .controls-row { margin-bottom: 0; flex: 1; }

    .conv-toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 0 16px;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: inherit;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .conv-toggle-btn:hover { background: var(--surface2); color: var(--text); }
    .conv-toggle-btn.active {
      background: var(--primary-glow);
      border-color: var(--primary);
      color: var(--accent);
    }

    /* ── Converter panel ── */
    .converter-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 12px;
      animation: panelIn 0.18s ease;
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .conv-panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .conv-amount-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .conv-amount-wrap { flex: 1; min-width: 180px; max-width: 340px; }
    .conv-eq {
      font-size: 22px;
      color: var(--text-muted);
      font-weight: 300;
      flex-shrink: 0;
    }
    .conv-result-box {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 160px;
    }
    .conv-result-num {
      font-size: 30px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.5px;
    }
    .conv-result-code {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .conv-rate-info {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.2px;
    }

    /* ── Desktop large screen enhancements ── */
    /* ══ MULTI-SCENARIO COMPARE ══ */
    .compare-toggle-area {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }
    .compare-toggle-btn {
      background: var(--surface2);
      border: 1px dashed var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 24px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      justify-content: center;
    }
    .compare-toggle-btn:hover { background: var(--surface3); border-color: var(--primary); color: var(--accent); }
    .compare-toggle-btn.active { background: var(--primary-glow); border-color: var(--primary); color: var(--accent); border-style: solid; }

    .compare-section {
      margin-top: 14px;
      animation: panelIn 0.2s ease;
    }
    .compare-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .compare-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .sc-add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .sc-add-btn:hover { opacity: 0.85; }
    .sc-add-btn:disabled { background: var(--surface3); color: var(--text-dim); cursor: not-allowed; }

    /* Scenario grid */
    .scenarios-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    /* Individual scenario card */
    .scenario-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .scenario-card.sc-has-result { border-color: rgba(255,105,160,0.4); }

    .sc-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sc-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .sc-label-1 { color: #58a6ff; }
    .sc-label-2 { color: #f78166; }
    .sc-label-3 { color: #d2a8ff; }
    .sc-label-4 { color: #56d364; }

    .sc-remove-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .sc-remove-btn:hover { color: var(--red); background: rgba(248,81,73,0.1); }

    .sc-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 10px 12px;
    }
    .sc-field label {
      display: block;
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .sc-result-bar {
      background: var(--surface2);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 38px;
    }
    .sc-result-empty { font-size: 11px; color: var(--text-dim); width: 100%; text-align: center; }
    .sc-fv-val { font-size: 16px; font-weight: 800; color: #ff6fa8; }
    .sc-profit-val { font-size: 12px; font-weight: 600; }
    .sc-profit-val.pos { color: #ff6fa8; }
    .sc-profit-val.neg { color: var(--red); }

    /* Comparison table */
    .compare-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    .compare-table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .compare-table-wrap th {
      background: var(--surface2);
      padding: 9px 14px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .compare-table-wrap th:first-child { text-align: left; }
    .compare-table-wrap td {
      padding: 9px 14px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-weight: 500;
      white-space: nowrap;
    }
    .compare-table-wrap td:first-child { text-align: left; color: var(--text-muted); font-size: 11px; }
    .compare-table-wrap tr:last-child td { border-bottom: none; }
    .compare-table-wrap td.best-fv { color: #ff6fa8; font-weight: 800; }
    .compare-table-wrap td.best-profit { color: #ff6fa8; font-weight: 700; }
    .compare-table-wrap td.neg-profit { color: var(--red); }
    .compare-table-wrap .best-badge { font-size: 10px; display: block; color: #ff6fa8; }

    /* Force-mobile overrides for compare */
    body.force-mobile .sc-inputs { grid-template-columns: 1fr; gap: 6px; padding: 10px 12px; }
    body.force-mobile .scenarios-grid { gap: 8px; }
    body.force-mobile .sc-fv-val { font-size: 15px; }

    @media (min-width: 960px) {
      .main { max-width: 1240px; padding: 24px 40px; }

      .controls-row { margin-bottom: 20px; }
      .control-block { padding: 12px 20px; gap: 10px; }
      .control-block label { font-size: 12px; }
      .controls-row select { font-size: 14px; padding: 7px 10px; }
      .mode-btn { font-size: 14px; padding: 9px 0; }

      .data-grid { gap: 16px; margin-bottom: 20px; }
      .data-card { padding: 20px 22px; }
      .card-label { width: 26px; height: 26px; font-size: 12px; }
      .card-title { font-size: 15px; }
      .card-status { font-size: 11px; padding: 3px 10px; }

      .field-group { margin-bottom: 14px; }
      .field-group label { font-size: 11px; margin-bottom: 6px; }
      .input-wrap input { font-size: 15px; padding: 9px 10px; }
      .input-prefix, .input-suffix { font-size: 14px; padding: 9px 10px; }
      .card-summary { font-size: 12px; padding: 8px 12px; margin-top: 12px; }

      .irr-extra { font-size: 12px; padding: 10px 14px; margin-top: 12px; }

      .calc-hint { font-size: 13px; padding: 8px 22px; }
      .calc-btn { padding: 14px 56px; font-size: 16px; }
      .reset-btn { font-size: 14px; padding: 13px 22px; }

      .result-big { font-size: 56px; }
      .result-unit { font-size: 24px; }
      .result-label { font-size: 15px; }
      .result-desc { font-size: 14px; margin-bottom: 24px; }
      .result-body { padding: 32px; }
      .breakdown-value { font-size: 22px; }
      .breakdown-label { font-size: 12px; }
      .breakdown-item { padding: 18px; }
      .result-breakdown { gap: 16px; }
    }
  </style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="header">
  <div class="header-icon">📊</div>
  <div class="header-text">
    <h1>IRR Sheet</h1>
    <p id="subtitle-text">Internal Rate of Return 年化報酬率計算器</p>
  </div>
  <button class="view-toggle-btn" id="view-toggle-btn" onclick="toggleView()" title="切換手機/電腦視圖">📱 手機版</button>
  <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
</header>

<!-- ══ MAIN ══ -->
<div class="main">

  <!-- Top controls -->
  <div class="controls-wrapper">
    <div class="controls-row" id="controls-row">
      <div class="control-block">
        <label id="lbl-currency">💱 貨幣</label>
        <select id="currency" onchange="onCurrencyChange()">
          <option value="USD" data-symbol="$">🇺🇸 美元 USD $</option>
          <option value="GBP" data-symbol="£">🇬🇧 英鎊 GBP £</option>
          <option value="EUR" data-symbol="€">🇪🇺 歐元 EUR €</option>
          <option value="JPY" data-symbol="¥">🇯🇵 日元 JPY ¥</option>
          <option value="KRW" data-symbol="₩">🇰🇷 韓幣 KRW ₩</option>
          <option value="TWD" data-symbol="NT$">🇹🇼 台幣 TWD NT$</option>
          <option value="CNY" data-symbol="¥">🇨🇳 人民幣 CNY ¥</option>
        </select>
      </div>

      <div class="controls-divider" id="conv-divider" style="display:none"></div>

      <div class="control-block" id="conv-col" style="display:none">
        <label id="lbl-convert">🔄 換算至</label>
        <select id="convert-currency" onchange="onConvertCurrencyChange()">
          <option value="USD" data-symbol="$">🇺🇸 USD $</option>
          <option value="GBP" data-symbol="£">🇬🇧 GBP £</option>
          <option value="EUR" data-symbol="€">🇪🇺 EUR €</option>
          <option value="JPY" data-symbol="¥">🇯🇵 JPY ¥</option>
          <option value="KRW" data-symbol="₩">🇰🇷 KRW ₩</option>
          <option value="TWD" data-symbol="NT$" selected>🇹🇼 TWD NT$</option>
          <option value="CNY" data-symbol="¥">🇨🇳 CNY ¥</option>
        </select>
        <span class="rate-badge loading" id="rate-badge" onclick="fetchRates()" title="點擊重新載入">…</span>
      </div>

      <div class="controls-divider"></div>

      <div class="control-block">
        <label id="lbl-method">📅 投資方式</label>
        <div class="mode-toggle">
          <button class="mode-btn active" id="btn-single" onclick="setMode('single')">單筆投資</button>
          <button class="mode-btn" id="btn-periodic" onclick="setMode('periodic')">定期定額</button>
        </div>
      </div>
    </div>
    <button class="conv-toggle-btn" id="conv-toggle-btn" onclick="toggleConverter()">⇄ 幣值換算</button>
  </div>

  <!-- Converter panel (hidden by default) -->
  <div id="converter-panel" class="converter-panel" style="display:none">
    <div class="conv-panel-header">
      <span>💱</span>
      <span id="conv-panel-title">幣值換算工具</span>
    </div>
    <div class="conv-amount-row">
      <div class="input-wrap conv-amount-wrap">
        <span class="input-prefix" id="conv-from-sym">$</span>
        <input type="number" id="conv-amount" placeholder="1" step="any" min="0" oninput="updateConverter()">
        <span class="input-suffix" id="conv-from-code">USD</span>
      </div>
      <div class="conv-eq">=</div>
      <div class="conv-result-box">
        <span class="conv-result-num" id="conv-result-num">—</span>
        <span class="conv-result-code" id="conv-result-code">TWD</span>
      </div>
    </div>
    <div class="conv-rate-info" id="conv-rate-info">—</div>
  </div>

  <!-- Error message -->
  <div class="error-msg" id="error-msg">
    <span>⚠️</span>
    <span id="error-text">請確認輸入資料</span>
  </div>

  <!-- ══ THREE DATA CARDS ══ -->
  <div class="data-grid">

    <!-- ── Card A: Investment ── -->
    <div class="data-card" id="card-invest">
      <div class="card-header">
        <div class="card-label" id="label-invest">A</div>
        <div class="card-title" id="card-a-title">投資輸入</div>
        <span class="card-status status-empty" id="status-invest">未填入</span>
      </div>

      <!-- Single mode -->
      <div id="single-mode-invest">
        <div class="field-row">
          <div class="field-group">
            <label id="lbl-annual-amt">每年投入金額</label>
            <div class="input-wrap">
              <span class="input-prefix" id="prefix-single">$</span>
              <input type="number" id="single-amount" placeholder="0" min="0" step="any" oninput="onFieldChange('invest')">
              <button class="clear-btn" onclick="clearField('single-amount', 'invest')" title="清除">✕</button>
            </div>
          </div>
          <div class="field-group">
            <label id="lbl-single-period">投資年期</label>
            <div class="input-wrap">
              <input type="number" id="single-years" placeholder="10" min="1" step="1" oninput="onFieldChange('invest')" style="padding-left:12px">
              <div class="period-unit-toggle">
                <button class="period-unit-btn active" id="unit-yr" onclick="setPeriodUnit('yr')">年</button>
                <button class="period-unit-btn" id="unit-mo" onclick="setPeriodUnit('mo')">月</button>
              </div>
            </div>
          </div>
        </div>
        <div class="card-summary" id="summary-single">
          <div class="sum-row">
            <span>總投入：</span>
            <span class="sum-value" id="sum-single-total">—</span>
          </div>
          <div class="sum-row" style="margin-top:4px">
            <span>總期數：</span>
            <span class="sum-value" id="sum-single-periods">—</span>
          </div>
        </div>
      </div>

      <!-- Periodic mode -->
      <div id="periodic-mode-invest" class="hidden">
        <div class="field-group">
          <label id="lbl-periodic-amt">每期投入金額</label>
          <div class="input-wrap">
            <span class="input-prefix" id="prefix-periodic">$</span>
            <input type="number" id="pmt-amount" placeholder="0" min="0" step="any" oninput="onFieldChange('invest')">
            <button class="clear-btn" onclick="clearField('pmt-amount', 'invest')" title="清除">✕</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label>投資年期（年）</label>
            <div class="input-wrap">
              <input type="number" id="pmt-years" placeholder="10" min="1" max="50" step="1" oninput="onFieldChange('invest')">
              <span class="input-suffix">年</span>
            </div>
          </div>
          <div class="field-group">
            <label>繳款頻率</label>
            <select id="pmt-freq" onchange="onFieldChange('invest')">
              <option value="12">月繳</option>
              <option value="4">季繳</option>
              <option value="2">半年繳</option>
              <option value="1">年繳</option>
            </select>
          </div>
        </div>
        <div class="card-summary visible" id="summary-periodic">
          <div class="sum-row">
            <span>總期數：</span>
            <span class="sum-value" id="sum-total-periods">—</span>
          </div>
          <div class="sum-row" style="margin-top:4px">
            <span>總投入：</span>
            <span class="sum-value" id="sum-total-invest">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Card B: IRR ── -->
    <div class="data-card" id="card-irr">
      <div class="card-header">
        <div class="card-label" id="label-irr">B</div>
        <div class="card-title" id="card-b-title">年化報酬率 (IRR)</div>
        <span class="card-status status-empty" id="status-irr">未填入</span>
      </div>
      <div class="irr-layout" id="summary-irr-info">
        <div class="field-group">
          <label>年化報酬率（每年）</label>
          <div class="input-wrap">
            <input type="number" id="irr-value" placeholder="0.00" step="0.01" oninput="onFieldChange('irr')" style="padding-left:12px">
            <span class="input-suffix">% / 年</span>
            <button class="clear-btn" onclick="clearField('irr-value', 'irr')" title="清除">✕</button>
          </div>
        </div>
        <div class="irr-stats-col">
          <div class="irr-stat-box">
            <div class="irr-stat-label">月化報酬率</div>
            <div class="irr-stat-val monthly" id="sum-monthly-rate">—</div>
          </div>
          <div class="irr-stat-box">
            <div class="irr-stat-label">翻倍年數</div>
            <div class="irr-stat-val rule72" id="sum-rule72">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Card C: Return ── -->
    <div class="data-card" id="card-return">
      <div class="card-header">
        <div class="card-label" id="label-return">C</div>
        <div class="card-title" id="card-c-title">最終報酬</div>
        <span class="card-status status-empty" id="status-return">未填入</span>
      </div>
      <div class="field-group">
        <label>期末總值（含本金）</label>
        <div class="input-wrap">
          <span class="input-prefix" id="prefix-return">$</span>
          <input type="number" id="return-amount" placeholder="0" min="0" step="any" oninput="onFieldChange('return')">
          <button class="clear-btn" onclick="clearField('return-amount', 'return')" title="清除">✕</button>
        </div>
      </div>
      <div class="card-summary" id="summary-return">
        <div class="sum-row">
          <span>損益：</span>
          <span class="sum-value" id="sum-profit">—</span>
        </div>
        <div class="sum-row" style="margin-top:4px">
          <span>報酬率：</span>
          <span class="sum-value" id="sum-simple-return">—</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ══ ACTION AREA ══ -->
  <div class="action-area">
    <div class="calc-hint" id="calc-hint">
      <div class="hint-dot" id="hint-dot"></div>
      <span id="hint-text">請填入任意兩項數據，第三項將自動推算</span>
    </div>

    <div class="btn-row">
      <button class="calc-btn" id="calc-btn" onclick="calculate()">
        <span class="btn-icon">⚡</span>
        立即計算
      </button>
      <button class="reset-btn" onclick="resetAll()">↺ 重置</button>
    </div>
  </div>

  <!-- ══ RESULT AREA ══ -->
  <div class="result-area" id="result-area">
    <div class="result-header">
      <div class="result-header-icon">✅</div>
      <div class="result-header-text">
        <h3>計算完成</h3>
        <p id="result-sub">推算結果如下</p>
      </div>
    </div>
    <div class="result-body">
      <div class="result-main">
        <div>

<script>
// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let mode = 'single'; // 'single' | 'periodic'
let filledFields = { invest: false, return: false, irr: false };

// ── Currency helpers ──────────────────────
function getCurrencySymbol() {
  const sel = document.getElementById('currency');
  const opt = sel.selectedOptions[0];
  return opt.dataset.symbol || '$';
}

function updateCurrencyDisplay() {
  const sym = getCurrencySymbol();
  ['prefix-single','prefix-periodic','prefix-return'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = sym;
  });
  updateSummaries();
}

// ── Format number ─────────────────────────
function fmt(n, decimals = 0) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString('zh-TW', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtMoney(n) {
  const sym = getCurrencySymbol();
  if (n === null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1e8) return sym + fmt(n/1e8, 2) + ' 億';
  if (Math.abs(n) >= 1e4) return sym + fmt(n/1e4, 2) + ' 萬';
  return sym + fmt(n, 0);
}

// ── Mode switching ───────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('btn-single').classList.toggle('active', m === 'single');
  document.getElementById('btn-periodic').classList.toggle('active', m === 'periodic');
  document.getElementById('single-mode-invest').classList.toggle('hidden', m !== 'single');
  document.getElementById('periodic-mode-invest').classList.toggle('hidden', m !== 'periodic');
  filledFields.invest = false;
  updateCardState('invest');
  updateHint();
  hideResult();
  clearError();
  updateSummaries();
}

// ── Field state ──────────────────────────
let autoCalcTimer = null;

// 清除自動計算填入的欄位（帶有 result-value class 的輸入框）
function clearAutoCalcField(inputId, card) {
  const el = document.getElementById(inputId);
  if (el && el.classList.contains('result-value')) {
    el.value = '';
    el.classList.remove('result-value');
    filledFields[card] = false;
    updateCardState(card);
    updateSummaries();
    hideResult();
  }
}

function onFieldChange(card) {
  const val = getCardValue(card);
  filledFields[card] = (val !== null);
  updateCardState(card);
  updateHint();
  clearError();
  if (card !== 'irr') hideResult();
  updateSummaries();

  // 當使用者修改某欄位時，若另一欄是「自動算出」的，先清除讓系統重新計算
  if (card === 'invest' || card === 'irr') {
    // A 或 B 有變動 → 清掉自動算出的 C（最終報酬）
    clearAutoCalcField('return-amount', 'return');
  }
  if (card === 'invest' || card === 'return') {
    // A 或 C 有變動 → 清掉自動算出的 B（IRR）
    clearAutoCalcField('irr-value', 'irr');
  }
  if (card === 'irr' || card === 'return') {
    // B 或 C 有變動 → 清掉自動算出的 A（投資輸入）
    clearAutoCalcField('single-amount', 'invest');
    clearAutoCalcField('pmt-amount', 'invest');
  }

  // 自動計算：任意兩欄填好後，延遲 700ms 自動執行
  clearTimeout(autoCalcTimer);
  const count = Object.values(filledFields).filter(Boolean).length;
  if (count === 2) {
    autoCalcTimer = setTimeout(() => {
      calculate();
    }, 700);
  }
}

function clearField(inputId, card) {
  const el = document.getElementById(inputId);
  if (el) { el.value = ''; el.classList.remove('result-value'); }
  // Also clear paired fields
  if (card === 'invest') {
    const ids = mode === 'single'
      ? ['single-amount','single-years']
      : ['pmt-amount','pmt-years'];
    ids.forEach(id => {
      const e = document.getElementById(id);
      if (e) { e.value = ''; e.classList.remove('result-value'); }
    });
  }
  if (card === 'return') {
    const e = document.getElementById('return-amount');
    if (e) { e.value = ''; e.classList.remove('result-value'); }
  }
  if (card === 'irr') {
    const e = document.getElementById('irr-value');
    if (e) { e.value = ''; e.classList.remove('result-value'); }
  }
  filledFields[card] = false;
  updateCardState(card);
  updateHint();
  hideResult();
  clearError();
  updateSummaries();
}

function resetAll() {
  ['single-amount','single-years','pmt-amount','pmt-years','return-amount','irr-value'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = ''; el.classList.remove('result-value'); }
  });
  setPeriodUnit('yr');   // reset to 年 mode
  filledFields = { invest: false, return: false, irr: false };
  ['invest','return','irr'].forEach(updateCardState);
  updateHint();
  hideResult();
  clearError();
  updateSummaries();
}

// ── Get card value ────────────────────────
function getCardValue(card) {
  if (card === 'invest') {
    if (mode === 'single') {
      const amt = parseFloat(document.getElementById('single-amount').value);
      const yrs = getSingleYears();
      if (!isNaN(amt) && amt > 0 && !isNaN(yrs) && yrs >= 1/12) return { amount: amt, years: yrs };
      return null;
    } else {
      const pmt = parseFloat(document.getElementById('pmt-amount').value);
      const yrs = parseFloat(document.getElementById('pmt-years').value);
      const freq = parseInt(document.getElementById('pmt-freq').value);
      if (!isNaN(pmt) && pmt > 0 && !isNaN(yrs) && yrs >= 1) return { pmt, years: yrs, freq };
      return null;
    }
  }
  if (card === 'return') {
    const v = parseFloat(document.getElementById('return-amount').value);
    return (!isNaN(v) && v > 0) ? v : null;
  }
  if (card === 'irr') {
    const v = parseFloat(document.getElementById('irr-value').value);
    return (!isNaN(v)) ? v / 100 : null; // store as decimal
  }
  return null;
}

// ── Card visual state ─────────────────────
function updateCardState(card) {
  const card_el = document.getElementById('card-' + card);
  const status_el = document.getElementById('status-' + card);
  const label_el = document.getElementById('label-' + card);
  const filled = filledFields[card];
  card_el.classList.toggle('has-data', filled);
  card_el.classList.remove('calculated');
  if (filled) {
    status_el.className = 'card-status status-filled';
    status_el.textContent = t('statusFilled');
  } else {
    status_el.className = 'card-status status-empty';
    status_el.textContent = t('statusEmpty');
  }
}

function setCardCalculated(card, value) {
  const card_el = document.getElementById('card-' + card);
  const status_el = document.getElementById('status-' + card);
  card_el.classList.remove('has-data');
  card_el.classList.add('calculated');
  status_el.className = 'card-status status-result';
  status_el.textContent = t('statusResult');
}

// ── Hint logic ───────────────────────────
function updateHint() {
  const count = Object.values(filledFields).filter(Boolean).length;
  const dot = document.getElementById('hint-dot');
  const text = document.getElementById('hint-text');
  const btn = document.getElementById('calc-btn');

  const L = T[lang];
  if (count === 0) {
    dot.className = 'hint-dot';
    text.textContent = L.hintEmpty;
    btn.disabled = true;
  } else if (count === 1) {
    dot.className = 'hint-dot partial';
    const missing = Object.keys(filledFields).filter(k => !filledFields[k]);
    text.textContent = L.hintPartial(missing.map(k => L.cardNames[k]).join('、'));
    btn.disabled = true;
  } else if (count === 2) {
    dot.className = 'hint-dot ready';
    const empty = Object.keys(filledFields).find(k => !filledFields[k]);
    text.textContent = L.hintReady(L.cardNames[empty]);
    btn.disabled = false;
  } else {
    dot.className = 'hint-dot partial';
    text.textContent = L.hintAllFilled;
    btn.disabled = false;
  }
}

// ── Summaries update ─────────────────────
function updateSummaries() {
  const sym = getCurrencySymbol();

  // Invest summary
  if (mode === 'single') {
    const amt = parseFloat(document.getElementById('single-amount').value);
    const rawVal = parseFloat(document.getElementById('single-years').value);
    const yrs = getSingleYears();
    const el = document.getElementById('sum-single-total');
    const summary = document.getElementById('summary-single');
    const periodLabel = periodUnit === 'mo'
      ? (isNaN(rawVal) ? '—' : Math.round(rawVal) + ' 月（' + (yrs).toFixed(1) + ' 年）')
      : (isNaN(rawVal) ? '—' : Math.round(rawVal) + ' 年');
    if (!isNaN(amt) && amt > 0 && !isNaN(yrs) && yrs >= 1/12) {
      const totalInvest = periodUnit === 'mo' ? amt * Math.ceil(yrs) : amt * Math.round(yrs);
      el.textContent = sym + fmt(totalInvest);
      document.getElementById('sum-single-periods').textContent = periodLabel;
      summary.classList.add('visible');
    } else if (!isNaN(amt) && amt > 0) {
      el.textContent = sym + fmt(amt) + ' × ?';
      document.getElementById('sum-single-periods').textContent = '—';
      summary.classList.add('visible');
    } else {
      summary.classList.remove('visible');
    }
    document.getElementById('summary-periodic').classList.remove('visible');
  } else {
    const pmt = parseFloat(document.getElementById('pmt-amount').value);
    const yrs = parseFloat(document.getElementById('pmt-years').value);
    const freq = parseInt(document.getElementById('pmt-freq').value);
    const summary = document.getElementById('summary-periodic');
    if (!isNaN(pmt) && !isNaN(yrs)) {
      const n = Math.round(yrs * freq);
      document.getElementById('sum-total-periods').textContent = n + ' 期';
      document.getElementById('sum-total-invest').textContent = sym + fmt(pmt * n);
      summary.classList.add('visible');
    } else {
      summary.classList.remove('visible');
    }
  }

  // Return summary
  const fv = parseFloat(document.getElementById('return-amount').value);
  const rSummary = document.getElementById('summary-return');
  if (!isNaN(fv) && fv > 0) {
    // Try to compute profit if invest is filled
    const inv = getCardValue('invest');
    let totalInvested = null;
    if (inv) {
      if (mode === 'single') totalInvested = inv.amount * Math.round(inv.years); // 每年金額 × 年期
      else totalInvested = inv.pmt * Math.round(inv.years * inv.freq);
    }
    if (totalInvested !== null) {
      const profit = fv - totalInvested;
      const pct = (profit / totalInvested * 100).toFixed(1);
      document.getElementById('sum-profit').textContent = (profit >= 0 ? '+' : '') + sym + fmt(profit) + ` (${pct}%)`;
      document.getElementById('sum-simple-return').textContent = (profit >= 0 ? '+' : '') + pct + '%';
      rSummary.classList.add('visible');
    } else {
      rSummary.classList.remove('visible');
    }
  } else {
    rSummary.classList.remove('visible');
  }

  // IRR summary
  const irrVal = parseFloat(document.getElementById('irr-value').value);
  if (!isNaN(irrVal) && irrVal !== 0) {
    const monthly = ((Math.pow(1 + irrVal/100, 1/12) - 1) * 100).toFixed(4);
    const r72 = (72 / irrVal).toFixed(1);
    document.getElementById('sum-monthly-rate').textContent = monthly + '%';
    document.getElementById('sum-rule72').textContent = r72 + ' 年';
  } else {
    document.getElementById('sum-monthly-rate').textContent = '—';
    document.getElementById('sum-rule72').textContent = '—';
  }
}

// ── IRR Newton-Raphson ───────────────────
function calcIRR(cashFlows, guess = 0.1) {
  // Try multiple starting points
  const guesses = [0.05, 0.1, 0.15, 0.2, 0.3, -0.05, 0.5, 0.01];
  for (let g of guesses) {
    const r = _irrIter(cashFlows, g);
    if (r !== null && isFinite(r) && r > -0.9999) return r;
  }
  return null;
}

function _irrIter(cashFlows, r0) {
  let r = r0;
  for (let i = 0; i < 200; i++) {
    let f = 0, df = 0;
    for (let t = 0; t < cashFlows.length; t++) {
      const pv = Math.pow(1 + r, -t);
      f  += cashFlows[t] * pv;
      df -= t * cashFlows[t] * pv / (1 + r);
    }
    if (Math.abs(df) < 1e-20) return null;
    const rNew = r - f / df;
    if (!isFinite(rNew)) return null;
    if (Math.abs(rNew - r) < 1e-9) return rNew;
    r = rNew;
  }
  return r;
}

// ── Build cash flows ─────────────────────
function buildCashFlows(invest, fv) {
  if (mode === 'single') {
    // 每年定額投入 amt，年末收款；最後一期同時繳款並領回 FV
    const { amount: amt, years } = invest;
    const n = Math.round(years);
    const flows = new Array(n + 1).fill(0);
    if (n === 1) {
      // 1 年：期初投入，期末領回（單筆複利邏輯）
      flows[0] = -amt;
      flows[1] = fv;
    } else {
      for (let t = 1; t <= n; t++) flows[t] = -amt;  // 每年年末付款
      flows[n] += fv;                                  // 第 n 年年末領回
    }
    return flows;
  } else {
    // Ordinary annuity: pay PMT at end of each period, receive FV at last period
    const { pmt: PMT, years, freq } = invest;
    const n = Math.round(years * freq); // total periods
    const flows = new Array(n + 1).fill(0);
    for (let t = 1; t <= n; t++) flows[t] = -PMT;
    flows[n] += fv; // net at last period
    return flows;
  }
}

// ── FV from IRR (annuity or single) ──────
function calcFV(invest, r_annual) {
  if (mode === 'single') {
    const { amount: amt, years } = invest;
    const n = Math.round(years);
    if (Math.abs(r_annual) < 1e-12) return amt * n;
    // n=1：單筆投入複利成長；n≥2：年金公式（每年末投入）
    if (n === 1) return amt * (1 + r_annual);
    return amt * (Math.pow(1 + r_annual, n) - 1) / r_annual;
  } else {
    const { pmt: PMT, years, freq } = invest;
    const n = Math.round(years * freq);
    const r = Math.pow(1 + r_annual, 1 / freq) - 1; // rate per period
    if (Math.abs(r) < 1e-12) return PMT * n; // r ≈ 0
    return PMT * (Math.pow(1 + r, n) - 1) / r;
  }
}

// ── PMT from IRR & FV ────────────────────
function calcPMT(fv, r_annual, years, freq) {
  const n = Math.round(years * freq);
  const r = Math.pow(1 + r_annual, 1 / freq) - 1;
  if (Math.abs(r) < 1e-12) return fv / n;
  return fv * r / (Math.pow(1 + r, n) - 1);
}

// ── P from IRR & FV (single) ─────────────
function calcP(fv, r_annual, years) {
  return fv / Math.pow(1 + r_annual, years);
}

// ── MAIN CALCULATE ───────────────────────
function calculate() {
  clearError();
  const count = Object.values(filledFields).filter(Boolean).length;

  if (count < 2) {
    showError(t('errFillTwo'));
    return;
  }

  const invest = getCardValue('invest');
  const fv = getCardValue('return');
  const r_annual = getCardValue('irr'); // decimal
  const sym = getCurrencySymbol();

  // Determine what to calculate
  const empty = Object.keys(filledFields).find(k => !filledFields[k]);

  try {
    if (empty === 'irr' || count === 3) {
      // Calculate IRR
      if (!invest || fv === null) { showError(t('errNeedAC')); return; }
      const flows = buildCashFlows(invest, fv);
      const r = calcIRR(flows);
      if (r === null || !isFinite(r)) { showError(t('errNoConverge')); return; }
      const pct = (r * 100).toFixed(4);
      const el = document.getElementById('irr-value');
      el.value = pct;
      el.classList.add('result-value');
      filledFields.irr = true;
      setCardCalculated('irr');
      showResult('irr', r * 100, invest, fv);
      updateSummaries();

    } else if (empty === 'return') {
      // Calculate FV
      if (!invest || r_annual === null) { showError(t('errNeedAB')); return; }
      const fvCalc = calcFV(invest, r_annual);
      if (!isFinite(fvCalc) || fvCalc <= 0) { showError(t('errAbnormal')); return; }
      const el = document.getElementById('return-amount');
      el.value = fvCalc.toFixed(2);
      el.classList.add('result-value');
      filledFields.return = true;
      setCardCalculated('return');
      showResult('return', fvCalc, invest, fvCalc);
      updateSummaries();

    } else if (empty === 'invest') {
      // Calculate investment
      if (fv === null || r_annual === null) { showError(t('errNeedBC')); return; }

      if (mode === 'single') {
        // 需要年期 — 用年金 PMT 公式反推每年投入金額
        const yrs = getSingleYears();
        if (isNaN(yrs) || yrs < 1/12) { showError(t('errYearsS')); return; }
        const n = Math.round(yrs);
        // n=1：單筆複利反推；n≥2：年金公式反推
        const amt = (Math.abs(r_annual) < 1e-12) ? fv / n
          : n === 1 ? fv / (1 + r_annual)
          : fv * r_annual / (Math.pow(1 + r_annual, n) - 1);
        if (!isFinite(amt) || amt <= 0) { showError(t('errAbnormal')); return; }
        const el = document.getElementById('single-amount');
        el.value = amt.toFixed(2);
        el.classList.add('result-value');
        filledFields.invest = true;
        setCardCalculated('invest');
        showResult('invest', amt, { amount: amt, years: yrs }, fv);
        updateSummaries();
      } else {
        const yrs = parseFloat(document.getElementById('pmt-years').value);
        const freq = parseInt(document.getElementById('pmt-freq').value);
        if (isNaN(yrs) || yrs < 1) { showError(t('errYearsP')); return; }
        const PMT = calcPMT(fv, r_annual, yrs, freq);
        if (!isFinite(PMT) || PMT <= 0) { showError(t('errAbnormal')); return; }
        const el = document.getElementById('pmt-amount');
        el.value = PMT.toFixed(2);
        el.classList.add('result-value');
        filledFields.invest = true;
        setCardCalculated('invest');
        const freqLabels = {12:'月',4:'季',2:'半年',1:'年'};
        showResult('invest', PMT, { pmt: PMT, years: yrs, freq }, fv);
        updateSummaries();
      }
    }
  } catch(e) {
    showError(t('errGeneral') + e.message);
  }
}

// ── Show Result ───────────────────────────
function showResult(calcType, calcValue, invest, fv) {
  const sym = getCurrencySymbol();
  const resultArea = document.getElementById('result-area');
  resultArea.classList.add('visible');
  // 自動捲動讓結果進入畫面
  setTimeout(() => resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);

  // Compute total invested
  let totalInvested = 0;
  if (mode === 'single') {
    totalInvested = invest.amount * Math.round(invest.years); // 每年投入 × 年期
  } else {
    totalInvested = invest.pmt * Math.round(invest.years * invest.freq);
  }
  const profit = fv - totalInvested;

  if (calcType === 'irr') {
    document.getElementById('result-label').textContent = t('resLabelIrr');
    document.getElementById('result-big').textContent = calcValue.toFixed(4);
    document.getElementById('result-unit').textContent = t('resUnitIrr');
    const r72 = calcValue !== 0 ? (72 / calcValue).toFixed(1) : '—';
    document.getElementById('result-desc').textContent = t('resDescIrr')(calcValue.toFixed(4), r72);
    document.getElementById('result-sub').textContent = t('resSubIrr');
  } else if (calcType === 'return') {
    document.getElementById('result-label').textContent = t('resLabelReturn');
    document.getElementById('result-big').textContent = fmt(fv, 0);
    document.getElementById('result-unit').textContent = sym;
    document.getElementById('result-desc').textContent = t('resDescReturn')(sym, fmt(fv,0), fmt(profit,0));
    document.getElementById('result-sub').textContent = t('resSubReturn');
  } else if (calcType === 'invest') {
    document.getElementById('result-label').textContent = mode === 'single' ? t('resLabelInvestS') : t('resLabelInvestP');
    document.getElementById('result-big').textContent = fmt(calcValue, 0);
    document.getElementById('result-unit').textContent = sym;
    const periods = mode === 'single' ? Math.round(invest.years) : Math.round(invest.years * invest.freq);
    document.getElementById('result-desc').textContent = mode === 'single'
      ? t('resDescInvestS')(sym, fmt(calcValue,0), Math.round(invest.years), fmt(fv,0))
      : t('resDescInvestP')(sym, fmt(calcValue,0), periods, fmt(fv,0));
    document.getElementById('result-sub').textContent = t('resSubInvest');
  }

  document.getElementById('bd-invest').textContent = sym + fmt(totalInvested, 0);
  document.getElementById('bd-return').textContent = sym + fmt(fv, 0);
  const profitStr = (profit >= 0 ? '+' : '') + sym + fmt(profit, 0) +
    ' (' + (profit >= 0 ? '+' : '') + (totalInvested > 0 ? (profit/totalInvested*100).toFixed(1) : '0') + '%)';
  document.getElementById('bd-profit').textContent = profitStr;
  document.getElementById('bd-profit').style.color = profit >= 0 ? '#ff6fa8' : 'var(--red)';

  // 換算金額

}

//  LIVE EXCHANGE RATES
// ══════════════════════════════════════════
let exchangeRates = {};   // { 'TWD': 31.5, 'EUR': 0.92, ... }
let lastFetchBase = '';
let lastResultFV = null;  // 記住最後計算的期末總值（原幣）

function getCurrencyCode() {
  return document.getElementById('currency').value;
}
function getConvertCode() {
  return document.getElementById('convert-currency').value;
}
function getConvertSymbol() {
  const sel = document.getElementById('convert-currency');
  return sel.selectedOptions[0]?.dataset.symbol || '';
}

async function fetchRates() {
  if (!showConverter) return;
  const base = getCurrencyCode();
  const badge = document.getElementById('rate-badge');
  badge.textContent = t('rateLoading');
  badge.className = 'rate-badge loading';

  // Try multiple APIs in order; first success wins
  const tryFetch = async (url, parseRates) => {
    const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return parseRates(data);
  };

  const sources = [
    [
      `https://api.frankfurter.app/latest?from=${base}`,
      d => d.rates
    ],
    [
      `https://open.er-api.com/v6/latest/${base}`,
      d => d.rates
    ],
    [
      `https://api.exchangerate-api.com/v4/latest/${base}`,
      d => d.rates
    ],
  ];

  for (const [url, parse] of sources) {
    try {
      const rates = await tryFetch(url, parse);
      if (!rates || typeof rates !== 'object') continue;
      exchangeRates = { ...rates };
      exchangeRates[base] = 1;
      lastFetchBase = base;
      updateRateDisplay();
      updateConverter();
      return;
    } catch (_) {
      // try next source
    }
  }

  // All sources failed
  exchangeRates = {};
  badge.textContent = t('rateError');
  badge.className = 'rate-badge error';
  document.getElementById('conv-rate-info').textContent = t('rateError');
}

function updateRateDisplay() {
  if (!showConverter) return;
  const badge = document.getElementById('rate-badge');
  const base = getCurrencyCode();
  const target = getConvertCode();
  if (base === target) { badge.textContent = '—'; badge.className = 'rate-badge'; return; }
  if (lastFetchBase !== base || !exchangeRates[target]) {
    badge.textContent = t('rateLoading'); badge.className = 'rate-badge loading';
    fetchRates(); return;
  }
  const rate = exchangeRates[target];
  badge.textContent = `1 ${base} = ${rate >= 10 ? rate.toFixed(1) : rate.toFixed(4)} ${target}`;
  badge.className = 'rate-badge';
  if (lastResultFV !== null) showConvertRow(lastResultFV);
}

function showConvertRow(fv) {
  const item = document.getElementById('bd-convert-item');
  if (!showConverter) { item.style.display = 'none'; return; }
  const target = getConvertCode();
  const base = getCurrencyCode();
  const el = document.getElementById('bd-convert');
  if (base === target || !exchangeRates[target]) { item.style.display = 'none'; return; }
  const rate = exchangeRates[target];
  const sym = getConvertSymbol();
  el.textContent = sym + fmt(fv * rate, 0) + ` ${target}`;
  item.style.display = 'block';
}

function onCurrencyChange() {
  updateCurrencyDisplay();
  exchangeRates = {};
  lastFetchBase = '';
  if (showConverter) {
    updateRateDisplay();
    updateConverterLabels();
  }
}

function onConvertCurrencyChange() {
  exchangeRates = {};
  lastFetchBase = '';
  updateRateDisplay();
  updateConverter();
}

// ── Converter toggle & live converter ────
let showConverter = false;

function toggleConverter() {
  showConverter = !showConverter;
  const btn = document.getElementById('conv-toggle-btn');
  const col = document.getElementById('conv-col');
  const divider = document.getElementById('conv-divider');
  const panel = document.getElementById('converter-panel');
  if (showConverter) {
    col.style.display = '';
    divider.style.display = '';
    panel.style.display = 'block';
    btn.classList.add('active');
    if (!exchangeRates[getConvertCode()]) fetchRates();
    else { updateRateDisplay(); updateConverter(); }
  } else {
    col.style.display = 'none';
    divider.style.display = 'none';
    panel.style.display = 'none';
    btn.classList.remove('active');
    document.getElementById('bd-convert-item').style.display = 'none';
  }
}

function updateConverterLabels() {
  const base = getCurrencyCode();
  const baseSel = document.getElementById('currency');
  const baseSym = baseSel.selectedOptions[0]?.dataset.symbol || '';
  document.getElementById('conv-from-sym').textContent = baseSym;
  document.getElementById('conv-from-code').textContent = base;
  updateConverter();
}

function updateConverter() {
  if (!showConverter) return;
  const base = getCurrencyCode();
  const target = getConvertCode();
  const baseSel = document.getElementById('currency');
  const baseSym = baseSel.selectedOptions[0]?.dataset.symbol || '';
  const targetSym = getConvertSymbol();

  // Update labels
  document.getElementById('conv-from-sym').textContent = baseSym;
  document.getElementById('conv-from-code').textContent = base;
  document.getElementById('conv-result-code').textContent = target;

  const amtEl = document.getElementById('conv-amount');
  const amt = parseFloat(amtEl.value);
  const resultEl = document.getElementById('conv-result-num');
  const rateInfoEl = document.getElementById('conv-rate-info');

  if (base === target) {
    resultEl.textContent = isNaN(amt) ? '—' : amt.toLocaleString();
    rateInfoEl.textContent = '1 ' + base + ' = 1 ' + target;
    return;
  }

  const rate = exchangeRates[target];
  if (!rate) {
    resultEl.textContent = '—';
    rateInfoEl.textContent = t('rateLoading');
    return;
  }

  if (!isNaN(amt) && amt >= 0) {
    const converted = amt * rate;
    const decimals = converted >= 100 ? 0 : converted >= 1 ? 2 : 4;
    resultEl.textContent = targetSym + converted.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: decimals });
  } else {
    resultEl.textContent = '—';
  }
  const rateDecimals = rate >= 10 ? 2 : 4;
  rateInfoEl.textContent = `1 ${base} = ${rate.toLocaleString(undefined, { maximumFractionDigits: rateDecimals })} ${target}`;
}

  // 直立螢幕 + 觸控，或手機 UA，或小螢幕 → 手機模式

let scenarios = [];
let scenarioCounter = 0;
let compareOpen = false;

const SC_COLORS = ['sc-label-1','sc-label-2','sc-label-3','sc-label-4'];

function toggleCompare() {
  compareOpen = !compareOpen;
  const section = document.getElementById('compare-section');
  const btn = document.getElementById('compare-toggle-btn');
  section.style.display = compareOpen ? 'block' : 'none';
  btn.classList.toggle('active', compareOpen);
  if (compareOpen && scenarios.length === 0) {
    addScenario();
    addScenario();
  }
}

function addScenario() {
  if (scenarios.length >= 4) return;
  scenarioCounter++;
  scenarios.push({ id: scenarioCounter, amount: '', years: '', irr: '' });
  renderScenarios();
  document.getElementById('sc-add-btn').disabled = scenarios.length >= 4;
}

function removeScenario(id) {
  scenarios = scenarios.filter(s => s.id !== id);
  renderScenarios();
  document.getElementById('sc-add-btn').disabled = scenarios.length >= 4;
}

function calcScenarioFV(amount, years, irr) {
  const amt = parseFloat(amount);
  const yrs = parseFloat(years);
  const r   = parseFloat(irr) / 100;
  if (isNaN(amt) || amt <= 0 || isNaN(yrs) || yrs <= 0 || isNaN(r)) return null;
  const n = Math.round(yrs);
  if (n === 1) return amt * (1 + r);
  if (Math.abs(r) < 1e-12) return amt * n;
  return amt * (Math.pow(1 + r, n) - 1) / r;
}

function onScenarioChange(id) {
  const s = scenarios.find(s => s.id === id);
  if (!s) return;
  s.amount = document.getElementById('sc-amt-' + id).value;
  s.years  = document.getElementById('sc-yrs-' + id).value;
  s.irr    = document.getElementById('sc-irr-'  + id).value;
  refreshScenarioResult(id);
  renderCompareTable();
}

function refreshScenarioResult(id) {
  const s = scenarios.find(s => s.id === id);
  if (!s) return;
  const sym = getCurrencySymbol();
  const fv  = calcScenarioFV(s.amount, s.years, s.irr);
  const bar = document.getElementById('sc-result-bar-' + id);
  const card = document.getElementById('sc-card-' + id);
  if (!bar) return;

  if (fv !== null && isFinite(fv)) {
    const amt  = parseFloat(s.amount);
    const yrs  = parseFloat(s.years);
    const n    = Math.round(yrs);
    const invested = amt * n;
    const profit   = fv - invested;
    const pct      = invested > 0 ? (profit / invested * 100).toFixed(1) : '0';
    bar.innerHTML  = `
      <span class="sc-fv-val">${sym}${fmt(fv, 0)}</span>
      <span class="sc-profit-val ${profit >= 0 ? 'pos' : 'neg'}">
        ${profit >= 0 ? '+' : ''}${sym}${fmt(Math.abs(profit), 0)} (${profit >= 0 ? '+' : '-'}${Math.abs(parseFloat(pct)).toFixed(1)}%)
      </span>`;
    card && card.classList.add('sc-has-result');
  } else {
    bar.innerHTML = '<span class="sc-result-empty">填入三項數值即可試算</span>';
    card && card.classList.remove('sc-has-result');
  }
}

function renderScenarios() {
  const grid = document.getElementById('scenarios-grid');
  const sym  = getCurrencySymbol();
  grid.innerHTML = scenarios.map((s, i) => {
    const colorClass = SC_COLORS[i] || SC_COLORS[0];
    const canRemove  = scenarios.length > 1;
    return `
    <div class="scenario-card" id="sc-card-${s.id}">
      <div class="sc-card-header">
        <span class="sc-label ${colorClass}">方案 ${i + 1}</span>
        ${canRemove ? `<button class="sc-remove-btn" onclick="removeScenario(${s.id})" title="移除">✕ 移除</button>` : ''}
      </div>
      <div class="sc-inputs">
        <div class="sc-field">
          <label>每年投入</label>
          <div class="input-wrap">
            <span class="input-prefix">${sym}</span>
            <input type="number" id="sc-amt-${s.id}" value="${s.amount}"
              placeholder="10000" min="0" step="any"
              oninput="onScenarioChange(${s.id})">
          </div>
        </div>
        <div class="sc-field">
          <label>年期</label>
          <div class="input-wrap">
            <input type="number" id="sc-yrs-${s.id}" value="${s.years}"
              placeholder="10" min="1" step="1"
              oninput="onScenarioChange(${s.id})" style="padding-left:10px">
            <span class="input-suffix">年</span>
          </div>
        </div>
        <div class="sc-field">
          <label>年化報酬率</label>
          <div class="input-wrap">
            <input type="number" id="sc-irr-${s.id}" value="${s.irr}"
              placeholder="8" step="0.1"
              oninput="onScenarioChange(${s.id})" style="padding-left:10px">
            <span class="input-suffix">%</span>
          </div>
        </div>
      </div>
      <div class="sc-result-bar" id="sc-result-bar-${s.id}">
        <span class="sc-result-empty">填入三項數值即可試算</span>
      </div>
    </div>`;
  }).join('');

  // Re-populate values and results
  scenarios.forEach(s => {
    if (s.amount) document.getElementById('sc-amt-' + s.id).value = s.amount;
    if (s.years)  document.getElementById('sc-yrs-' + s.id).value = s.years;
    if (s.irr)    document.getElementById('sc-irr-'  + s.id).value = s.irr;
    refreshScenarioResult(s.id);
  });

  renderCompareTable();
}

function renderCompareTable() {
  const wrap = document.getElementById('compare-table-wrap');
  if (scenarios.length < 2) { wrap.innerHTML = ''; return; }

  const sym  = getCurrencySymbol();
  const data = scenarios.map((s, i) => {
    const fv  = calcScenarioFV(s.amount, s.years, s.irr);
    const amt = parseFloat(s.amount);
    const yrs = parseFloat(s.years);
    const irr = parseFloat(s.irr);
    const n   = (!isNaN(yrs) && yrs > 0) ? Math.round(yrs) : null;
    const invested = (n && !isNaN(amt)) ? amt * n : null;
    const profit   = (fv !== null && invested !== null) ? fv - invested : null;
    return { label: `方案 ${i+1}`, fv, invested, profit, irr };
  });

  const fvValues     = data.map(d => d.fv).filter(v => v != null && isFinite(v));
  const profitValues = data.map(d => d.profit).filter(v => v != null && isFinite(v));
  const maxFV        = fvValues.length    ? Math.max(...fvValues)    : null;
  const maxProfit    = profitValues.length ? Math.max(...profitValues) : null;

  const fmtCell = (val, prefix) =>
    val != null && isFinite(val) ? prefix + fmt(Math.abs(val), 0) : '—';

  wrap.innerHTML = `
    <div class="compare-table-wrap">
      <table>
        <thead>
          <tr>
            <th>指標</th>
            ${data.map((d, i) => {
              const isBest = d.fv != null && d.fv === maxFV && fvValues.length > 1;
              return `<th class="${SC_COLORS[i]}">${d.label}${isBest ? '<span class="best-badge">🏆 最高報酬</span>' : ''}</th>`;
            }).join('')}
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>總投入本金</td>
            ${data.map(d => `<td>${d.invested != null ? sym + fmt(d.invested, 0) : '—'}</td>`).join('')}
          </tr>
          <tr>
            <td>最終報酬</td>
            ${data.map(d => {
              const isBest = d.fv != null && d.fv === maxFV && fvValues.length > 1;
              return `<td class="${isBest ? 'best-fv' : ''}">${d.fv != null ? sym + fmt(d.fv, 0) : '—'}</td>`;
            }).join('')}
          </tr>
          <tr>
            <td>投資獲利</td>
            ${data.map(d => {
              const isBest = d.profit != null && d.profit === maxProfit && profitValues.length > 1;
              const cls    = d.profit != null ? (d.profit < 0 ? 'neg-profit' : isBest ? 'best-profit' : '') : '';
              const sign   = d.profit != null ? (d.profit >= 0 ? '+' : '-') : '';
              return `<td class="${cls}">${d.profit != null ? sign + sym + fmt(Math.abs(d.profit), 0) : '—'}</td>`;
            }).join('')}
          </tr>
          <tr>
            <td>年化報酬率</td>
            ${data.map(d => `<td>${!isNaN(d.irr) ? d.irr.toFixed(2) + '%' : '—'}</td>`).join('')}
          </tr>
          <tr>
            <td>投報率</td>
            ${data.map(d => {
              if (d.profit == null || d.invested == null || d.invested <= 0) return '<td>—</td>';
              const pct = (d.profit / d.invested * 100).toFixed(1);
              return `<td class="${d.profit >= 0 ? '' : 'neg-profit'}">${d.profit >= 0 ? '+' : ''}${pct}%</td>`;
            }).join('')}
          </tr>
        </tbody>
      </table>
    </div>`;
}
</script>

</body>
</html>
